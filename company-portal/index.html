<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Portal · AI Learning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #4b2e83; --purple-dark: #2e1b5e; --purple-mid: #6b4fa0;
  --purple-tint: #f2eefa; --gold: #b7a57a; --gold-mid: #85754d; --gold-light: #e6dcc6;
  --white: #ffffff; --off-white: #faf9fd; --gray: #f0eef8;
  --text: #1c1230; --text-mid: #5a5070; --text-light: #8a84a0; --border: #e0dcf0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; color: var(--text); background: var(--off-white); }

.portal-header {
  background: var(--purple-dark); border-bottom: 2px solid var(--gold);
  padding: 0 40px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.brand { display: flex; flex-direction: column; text-decoration: none; }
.brand-name { color: var(--white); font-size: 14px; font-weight: 600; letter-spacing: 0.03em; }
.brand-sub { color: var(--gold); font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; }
.header-right { display: flex; align-items: center; gap: 16px; }
.user-email { color: rgba(255,255,255,0.6); font-size: 12px; }
.btn-signout { background: transparent; border: 1px solid rgba(183,165,122,0.45); color: var(--gold-light); padding: 6px 14px; border-radius: 4px; font-size: 12px; font-weight: 500; font-family: 'IBM Plex Sans', sans-serif; cursor: pointer; transition: background 0.15s; }
.btn-signout:hover { background: rgba(183,165,122,0.12); }

.page-main { max-width: 860px; margin: 0 auto; padding: 48px 40px 80px; }

/* Company hero */
.company-hero {
  background: var(--white); border: 1px solid var(--border); border-radius: 8px;
  padding: 36px 36px 32px; margin-bottom: 40px;
  display: flex; align-items: flex-start; gap: 28px;
}
.company-logo-wrap { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.company-logo-wrap img { max-width: 80px; max-height: 80px; object-fit: contain; }
.company-logo-placeholder { width: 72px; height: 72px; border-radius: 8px; background: var(--gray); border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-light); letter-spacing: 0.06em; text-transform: uppercase; }
.company-info {}
.company-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-mid); margin-bottom: 6px; }
.company-title { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 600; color: var(--purple-dark); line-height: 1.1; margin-bottom: 6px; }
.company-sector { display: inline-block; background: var(--purple-tint); color: var(--purple-mid); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 3px; }

/* Deliverable cards */
.section-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-mid); margin-bottom: 16px; }

.del-card { background: var(--white); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 24px; overflow: hidden; }

.del-header { background: var(--purple-dark); padding: 18px 28px; display: flex; align-items: center; gap: 20px; }
.del-week-num { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 700; color: var(--gold); opacity: 0.55; line-height: 1; width: 32px; flex-shrink: 0; }
.del-header-text h3 { color: var(--white); font-size: 15px; font-weight: 600; }
.del-tag { display: inline-block; margin-top: 5px; background: rgba(183,165,122,0.18); color: var(--gold-light); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 3px; }

.del-body { padding: 28px; }

.subsection-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-light); margin-bottom: 10px; }
.student-notes-block {
  background: var(--off-white); border-left: 3px solid var(--border);
  padding: 14px 18px; border-radius: 0 5px 5px 0;
  font-size: 14px; color: var(--text-mid); line-height: 1.65;
  margin-bottom: 24px; white-space: pre-wrap;
}
.notes-empty { color: var(--text-light); font-style: italic; }

/* File rows */
.files-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.file-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--off-white); transition: background 0.15s; }
.file-item:hover { background: var(--purple-tint); }
.file-icon { width: 34px; height: 34px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; }
.file-icon.pdf  { background: #fde8e8; color: #b91c1c; }
.file-icon.docx, .file-icon.doc  { background: #dbeafe; color: #1d4ed8; }
.file-icon.pptx, .file-icon.ppt  { background: #ffedd5; color: #c2410c; }
.file-icon.other { background: var(--gray); color: var(--text-light); }
.file-info { flex: 1; min-width: 0; }
.file-name-link { font-size: 14px; color: var(--purple); text-decoration: none; font-weight: 600; display: block; margin-bottom: 4px; }
.file-name-link:hover { text-decoration: underline; }
.file-student-comment { font-size: 13px; color: var(--text-mid); line-height: 1.5; }
.file-student-comment.empty { color: var(--text-light); font-style: italic; }
.no-files { font-size: 14px; color: var(--text-light); font-style: italic; margin-bottom: 24px; }

/* Comments */
.comments-section { border-top: 1px solid var(--border); padding-top: 22px; }
.comments-thread { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.comment-row { display: flex; gap: 12px; }
.comment-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--purple); color: var(--gold); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.comment-bubble { background: var(--gray); border-radius: 0 8px 8px 8px; padding: 12px 16px; flex: 1; }
.comment-meta { font-size: 11px; color: var(--text-light); margin-bottom: 5px; }
.comment-meta strong { color: var(--text-mid); font-size: 13px; }
.comment-body { font-size: 14px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
.no-comments { font-size: 13px; color: var(--text-light); font-style: italic; margin-bottom: 16px; }

/* Comment form */
.comment-form { display: flex; flex-direction: column; gap: 10px; }
.comment-textarea {
  width: 100%; border: 1.5px solid var(--border); border-radius: 6px;
  padding: 12px 14px; font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px; color: var(--text); background: var(--white);
  outline: none; resize: vertical; min-height: 80px; line-height: 1.6;
  transition: border-color 0.2s;
}
.comment-textarea:focus { border-color: var(--purple); }
.comment-textarea::placeholder { color: var(--text-light); }
.comment-form-row { display: flex; justify-content: flex-end; }
.btn-post-comment {
  background: var(--purple); color: var(--white); border: none;
  padding: 10px 22px; border-radius: 5px; font-size: 13px; font-weight: 600;
  font-family: 'IBM Plex Sans', sans-serif; cursor: pointer; transition: background 0.15s;
}
.btn-post-comment:hover { background: var(--purple-dark); }
.btn-post-comment:disabled { opacity: 0.55; cursor: not-allowed; }

/* Toast */
.toast { position: fixed; bottom: 28px; right: 28px; background: var(--purple-dark); color: var(--white); padding: 12px 20px; border-radius: 6px; border-left: 3px solid var(--gold); font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(10px); transition: opacity 0.25s, transform 0.25s; pointer-events: none; z-index: 1000; }
.toast.show { opacity: 1; transform: translateY(0); }

.page-loading { text-align: center; padding: 80px; color: var(--text-light); font-size: 14px; }

@media (max-width: 640px) {
  .portal-header { padding: 0 20px; }
  .page-main { padding: 32px 20px 60px; }
  .company-hero { flex-direction: column; gap: 16px; padding: 24px; }
  .del-header { padding: 14px 20px; }
  .del-body { padding: 20px; }
}
</style>
</head>
<body>

<header class="portal-header">
  <a href="/" class="brand">
    <span class="brand-name">AI Learning Lab</span>
    <span class="brand-sub">Company Portal</span>
  </a>
  <div class="header-right">
    <span class="user-email" id="user-email"></span>
    <button class="btn-signout" id="signout-btn">Sign out</button>
  </div>
</header>

<main class="page-main">
  <div id="page-loading" class="page-loading">Loading your dashboard…</div>
  <div id="content" style="display:none;"></div>
</main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/portal/js/config.js"></script>
<script>
var _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var CID          = '';
var CONTACT_NAME = '';

var WEEKS = [
  { n:1, title:'Market Research',    tag:'Exec-ready'        },
  { n:2, title:'Business Case',       tag:'5–8 slide deck'    },
  { n:3, title:'Customer Validation', tag:'Primary research'  },
  { n:4, title:'AI POC / MVP',        tag:'Live demo'         },
  { n:5, title:'Go-to-Market Plan',   tag:'Actionable roadmap'},
  { n:6, title:'Demo Day',            tag:'Board-ready'       }
];

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  var { data: { session } } = await _sb.auth.getSession();
  if (!session) { window.location.href = '/company-portal/login/'; return; }

  var email = session.user.email;
  document.getElementById('user-email').textContent = email;
  document.getElementById('signout-btn').addEventListener('click', async function() {
    await _sb.auth.signOut(); window.location.href = '/company-portal/login/';
  });

  // Verify company contact (organizers bypass this check)
  var { data: contact } = await _sb.from('company_contacts')
    .select('company_id, name').eq('email', email).maybeSingle();
  if (!contact && !PORTAL_ALLOWED_EMAILS.includes(email)) {
    await _sb.auth.signOut(); window.location.href = '/company-portal/login/?error=notallowed'; return;
  }

  CONTACT_NAME = contact ? (contact.name || email) : email;

  if (!contact) {
    await showCompanyPicker();
  } else {
    CID = contact.company_id;
    await loadDashboard();
  }
}

async function showCompanyPicker() {
  var { data: companies } = await _sb.from('companies').select('id, name, sector, logo_url').eq('active', true).order('name');
  document.getElementById('page-loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  var cards = (companies || []).map(function(co) {
    var logo = co.logo_url
      ? '<img src="' + escA(co.logo_url) + '" alt="" style="width:48px;height:48px;object-fit:contain;">'
      : '<div style="width:48px;height:48px;border-radius:6px;background:var(--gray);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-light);text-transform:uppercase;letter-spacing:0.06em;">Logo</div>';
    return '<div onclick="pickCompanyById(\'' + escA(co.id) + '\')" style="display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--white);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color 0.15s;" onmouseover="this.style.borderColor=\'var(--purple)\'" onmouseout="this.style.borderColor=\'var(--border)\'">' +
      '<div style="flex-shrink:0;">' + logo + '</div>' +
      '<div>' +
        '<div style="font-size:15px;font-weight:600;color:var(--purple-dark);">' + esc(co.name) + '</div>' +
        (co.sector ? '<div style="font-size:12px;color:var(--text-light);margin-top:2px;">' + esc(co.sector) + '</div>' : '') +
      '</div>' +
    '</div>';
  }).join('');
  document.getElementById('content').innerHTML =
    '<div style="max-width:560px;margin:0 auto;padding:48px 0;">' +
      '<div style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-mid);margin-bottom:10px;">Organizer View</div>' +
      '<h2 style="font-family:\'Cormorant Garamond\',serif;font-size:28px;color:var(--purple-dark);margin-bottom:28px;">Select a company to view</h2>' +
      '<div style="display:flex;flex-direction:column;gap:12px;">' + cards + '</div>' +
    '</div>';
}

async function pickCompanyById(id) {
  CID = id;
  document.getElementById('content').innerHTML = '<div class="page-loading">Loading…</div>';
  await loadDashboard();
}

async function loadDashboard() {
  var { data: co } = await _sb.from('companies').select('*').eq('id', CID).single();
  var { data: delivs } = await _sb.from('deliverables')
    .select('*, deliverable_files(*), deliverable_comments(*)')
    .eq('company_id', CID).order('week_number');
  var delMap = {};
  if (delivs) delivs.forEach(function(d) { delMap[d.week_number] = d; });
  document.getElementById('page-loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.getElementById('content').innerHTML = renderPage(co, delMap);
  document.title = (co ? co.name : 'Company') + ' Portal · AI Learning Lab';
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderPage(co, delMap) {
  var logo = co && co.logo_url
    ? '<img src="' + escA(co.logo_url) + '" alt="logo">'
    : '<div class="company-logo-placeholder">Logo</div>';
  var sector = co && co.sector ? '<span class="company-sector">' + esc(co.sector) + '</span>' : '';

  var hero = '<div class="company-hero">' +
    '<div class="company-logo-wrap">' + logo + '</div>' +
    '<div class="company-info">' +
      '<div class="company-eyebrow">AI Learning Lab — Spring Cohort</div>' +
      '<div class="company-title">' + esc(co ? co.name : '–') + '</div>' +
      sector +
    '</div>' +
  '</div>';

  var cards = WEEKS.map(function(w) {
    var d     = delMap[w.n] || {};
    var files = d.deliverable_files || [];
    var comms = (d.deliverable_comments || []).filter(function(c) { return c.author_type === 'company'; });
    return delivCard(w, d, files, comms);
  }).join('');

  return hero +
    '<div class="section-eyebrow">Weekly deliverables</div>' +
    cards;
}

function delivCard(w, d, files, comms) {
  var pad = w.n < 10 ? '0' + w.n : '' + w.n;

  // Notes
  var notesHtml = d.notes && d.notes.trim()
    ? '<div class="student-notes-block">' + esc(d.notes) + '</div>'
    : '<div class="student-notes-block notes-empty">No notes added yet.</div>';

  // Files
  var filesHtml = files.length ? files.map(function(f) {
    var ext = (f.file_name.split('.').pop() || '').toLowerCase();
    var cls = ['pdf','docx','doc','pptx','ppt'].indexOf(ext) !== -1 ? ext : 'other';
    var comment = f.student_comment && f.student_comment.trim()
      ? '<div class="file-student-comment">' + esc(f.student_comment) + '</div>'
      : '<div class="file-student-comment empty">No note added.</div>';
    return '<div class="file-item">' +
      '<div class="file-icon ' + cls + '">' + ext.toUpperCase().slice(0,4) + '</div>' +
      '<div class="file-info">' +
        '<a href="' + escA(f.file_url) + '" target="_blank" rel="noopener" class="file-name-link">' + esc(f.file_name) + '</a>' +
        comment +
      '</div>' +
    '</div>';
  }).join('') : '<p class="no-files">No files uploaded yet.</p>';

  // Comments
  var commsHtml = comms.length ? comms.map(function(c) {
    var initial = (c.author_name || c.author_email || '?')[0].toUpperCase();
    var ts = new Date(c.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric' }) +
             ' at ' + new Date(c.created_at).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
    return '<div class="comment-row">' +
      '<div class="comment-avatar">' + initial + '</div>' +
      '<div class="comment-bubble">' +
        '<div class="comment-meta"><strong>' + esc(c.author_name || c.author_email) + '</strong> · ' + ts + '</div>' +
        '<div class="comment-body">' + esc(c.body) + '</div>' +
      '</div>' +
    '</div>';
  }).join('') : '<p class="no-comments">No comments yet. Be the first to leave feedback.</p>';

  return '<div class="del-card" id="del-' + w.n + '">' +
    '<div class="del-header">' +
      '<div class="del-week-num">' + pad + '</div>' +
      '<div class="del-header-text">' +
        '<h3>Week ' + w.n + ' — ' + esc(w.title) + '</h3>' +
        '<span class="del-tag">' + esc(w.tag) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="del-body">' +
      '<div class="subsection-label">Student notes</div>' + notesHtml +
      '<div class="subsection-label">Deliverable files</div>' +
      '<div class="files-list">' + filesHtml + '</div>' +
      '<div class="comments-section">' +
        '<div class="subsection-label">Your team\'s feedback</div>' +
        '<div class="comments-thread" id="thread-' + w.n + '">' + commsHtml + '</div>' +
        '<div class="comment-form">' +
          '<textarea id="new-comment-' + w.n + '" class="comment-textarea" placeholder="Leave feedback on this week\'s work…"></textarea>' +
          '<div class="comment-form-row">' +
            '<button class="btn-post-comment" onclick="postComment(' + w.n + ', this)" id="post-btn-' + w.n + '">Post comment</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ── Commenting ────────────────────────────────────────────────────────────────

var delivIds = {};

async function ensureDeliverable(n) {
  if (delivIds[n]) return delivIds[n];
  var r = await _sb.from('deliverables')
    .select('id').eq('company_id', CID).eq('week_number', n).maybeSingle();
  if (r.data) { delivIds[n] = r.data.id; return r.data.id; }
  // Create empty deliverable if none exists
  var ins = await _sb.from('deliverables')
    .insert({ company_id: CID, week_number: n, notes: '' })
    .select('id').single();
  if (ins.error) throw new Error(ins.error.message);
  delivIds[n] = ins.data.id;
  return ins.data.id;
}

async function postComment(n, btn) {
  var ta = document.getElementById('new-comment-' + n);
  var body = ta.value.trim();
  if (!body) return;

  btn.disabled = true; btn.textContent = 'Posting…';

  try {
    var did = await ensureDeliverable(n);
    var { data: comment, error } = await _sb.from('deliverable_comments').insert({
      deliverable_id: did,
      author_email: (await _sb.auth.getSession()).data.session.user.email,
      author_name: CONTACT_NAME,
      author_type: 'company',
      body: body
    }).select().single();

    if (error) throw error;

    // Append to thread
    var thread = document.getElementById('thread-' + n);
    var noComments = thread.querySelector('.no-comments');
    if (noComments) noComments.remove();

    var ts = new Date(comment.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric' }) +
             ' at ' + new Date(comment.created_at).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
    var initial = (CONTACT_NAME || comment.author_email || '?')[0].toUpperCase();
    var row = document.createElement('div');
    row.className = 'comment-row';
    row.innerHTML = '<div class="comment-avatar">' + initial + '</div>' +
      '<div class="comment-bubble">' +
        '<div class="comment-meta"><strong>' + esc(CONTACT_NAME) + '</strong> · ' + ts + '</div>' +
        '<div class="comment-body">' + esc(body) + '</div>' +
      '</div>';
    thread.appendChild(row);
    ta.value = '';
    toast('Comment posted');
  } catch (err) {
    alert('Error posting comment: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Post comment';
  }
}

// ── Utilities ─────────────────────────────────────────────────────────────────

var _tT;
function toast(m) {
  var el = document.getElementById('toast');
  el.textContent = m; el.classList.add('show');
  if (_tT) clearTimeout(_tT);
  _tT = setTimeout(function() { el.classList.remove('show'); }, 2200);
}
function esc(s) { var d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function escA(s) { return (s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

init();
</script>
</body>
</html>
