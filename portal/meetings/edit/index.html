<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Meeting · Organizer Portal · AI Learning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #4b2e83;
  --purple-dark: #2e1b5e;
  --purple-mid: #6b4fa0;
  --purple-tint: #f2eefa;
  --gold: #b7a57a;
  --gold-light: #e6dcc6;
  --white: #ffffff;
  --off-white: #faf9fd;
  --text: #1c1230;
  --text-mid: #5a5070;
  --text-light: #8a84a0;
  --border: #e0dcf0;
  --error-text: #8b1a1a;
  --error-bg: #fdf2f2;
  --error-border: #e8b4b4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; background: var(--off-white); color: var(--text); }

.portal-header {
  background: var(--purple-dark);
  border-bottom: 2px solid var(--gold);
  padding: 0 40px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.portal-brand { display: flex; flex-direction: column; text-decoration: none; }
.portal-brand-name { color: var(--white); font-size: 14px; font-weight: 600; letter-spacing: 0.03em; }
.portal-brand-sub { color: var(--gold); font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; }
.btn-signout {
  background: transparent; border: 1px solid rgba(183,165,122,0.45); color: var(--gold-light);
  padding: 6px 14px; border-radius: 4px; font-size: 12px; font-weight: 500;
  font-family: 'IBM Plex Sans', sans-serif; cursor: pointer;
}
.btn-signout:hover { background: rgba(183,165,122,0.12); border-color: var(--gold); }

.portal-main { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
.page-header { margin-bottom: 36px; }
.breadcrumb { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }
.breadcrumb a { color: var(--purple-mid); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.page-header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px; font-weight: 600; color: var(--purple-dark);
}

.form-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 36px 40px;
}
.form-group { margin-bottom: 24px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
label {
  display: block;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-mid); margin-bottom: 7px;
}
label .required { color: var(--purple); margin-left: 2px; }
label .hint { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11px; color: var(--text-light); margin-left: 6px; }
input[type="text"],
input[type="email"],
input[type="datetime-local"],
textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 5px;
  font-size: 14px;
  font-family: 'IBM Plex Sans', sans-serif;
  color: var(--text);
  background: var(--white);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus {
  outline: none;
  border-color: var(--purple-mid);
  box-shadow: 0 0 0 3px rgba(75,46,131,0.1);
}
textarea { resize: vertical; min-height: 90px; }

.section-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
.attendees-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.attendees-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-mid); }
.attendees-hint { font-size: 12px; color: var(--text-light); margin-bottom: 12px; }

.attendee-row {
  display: grid; grid-template-columns: 1fr 1fr auto;
  gap: 10px; align-items: center;
  padding: 10px 14px; border-radius: 5px; margin-bottom: 6px;
}
.attendee-row.locked { background: var(--off-white); border: 1px solid var(--border); }
.attendee-row.extra { background: var(--white); border: 1.5px solid var(--border); }
.attendee-locked-name { font-size: 14px; font-weight: 500; color: var(--text); }
.attendee-locked-email { font-size: 13px; color: var(--text-mid); }
.attendee-badge {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--purple-mid); background: var(--purple-tint);
  padding: 3px 8px; border-radius: 3px; white-space: nowrap;
}
.attendee-row input {
  padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 4px;
  font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; color: var(--text); width: 100%;
}
.attendee-row input:focus {
  outline: none; border-color: var(--purple-mid); box-shadow: 0 0 0 2px rgba(75,46,131,0.1);
}
.btn-remove-attendee {
  background: transparent; border: 1px solid var(--border); color: var(--text-light);
  width: 30px; height: 30px; border-radius: 4px; font-size: 16px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s; flex-shrink: 0;
}
.btn-remove-attendee:hover { background: var(--error-bg); color: var(--error-text); border-color: var(--error-border); }
.btn-add-attendee {
  background: transparent; border: 1.5px dashed var(--border); color: var(--purple-mid);
  padding: 9px 18px; border-radius: 5px; font-size: 13px; font-weight: 500;
  font-family: 'IBM Plex Sans', sans-serif; cursor: pointer; width: 100%;
  text-align: left; margin-top: 6px; transition: background 0.15s, border-color 0.15s;
}
.btn-add-attendee:hover { background: var(--purple-tint); border-color: var(--purple-mid); border-style: solid; }

.form-error { display: none; padding: 12px 16px; border-radius: 5px; font-size: 14px; background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); margin-bottom: 20px; }
.form-error.visible { display: block; }
.form-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--border); }
.btn-cancel { color: var(--text-mid); font-size: 14px; text-decoration: none; }
.btn-cancel:hover { color: var(--purple); }
.btn-submit {
  background: var(--purple); color: var(--white); border: none;
  padding: 12px 28px; border-radius: 5px; font-size: 14px; font-weight: 600;
  font-family: 'IBM Plex Sans', sans-serif; letter-spacing: 0.03em;
  cursor: pointer; transition: background 0.15s;
}
.btn-submit:hover { background: var(--purple-dark); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

.loading-overlay { text-align: center; padding: 60px; color: var(--text-light); font-size: 14px; }

@media (max-width: 600px) {
  .form-row { grid-template-columns: 1fr; }
  .form-card { padding: 24px 20px; }
  .portal-header { padding: 0 20px; }
}
</style>
</head>
<body>

<header class="portal-header">
  <a href="/portal/" class="portal-brand">
    <span class="portal-brand-name">AI Learning Lab</span>
    <span class="portal-brand-sub">Organizer Portal</span>
  </a>
  <button class="btn-signout" id="signout-btn">Sign out</button>
</header>

<main class="portal-main">
  <div class="page-header">
    <div class="breadcrumb"><a href="/portal/">Meetings</a> › Edit meeting</div>
    <h1 id="page-title">Edit meeting</h1>
  </div>

  <div id="form-container" class="form-card">
    <div class="loading-overlay">Loading…</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/portal/js/config.js"></script>
<script>
var _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var extraAttendees = [];
var currentSession = null;
var meetingId = null;
var allCohorts = [];

async function init() {
  var result = await _supabase.auth.getSession();
  currentSession = result.data.session;
  if (!currentSession) {
    window.location.href = '/portal/login/';
    return;
  }

  meetingId = new URLSearchParams(window.location.search).get('id');
  if (!meetingId) {
    window.location.href = '/portal/';
    return;
  }

  document.getElementById('signout-btn').addEventListener('click', async function() {
    await _supabase.auth.signOut();
    window.location.href = '/portal/login/';
  });

  await loadMeeting();
}

async function loadMeeting() {
  var [meetingResult, attendeesResult] = await Promise.all([
    _supabase.from('meetings').select('*').eq('id', meetingId).single(),
    _supabase.from('meeting_attendees').select('*').eq('meeting_id', meetingId)
  ]);

  if (meetingResult.error || !meetingResult.data) {
    document.getElementById('form-container').innerHTML =
      '<p style="color:var(--error-text);padding:20px;">Meeting not found.</p>';
    return;
  }

  var meeting = meetingResult.data;
  var attendees = attendeesResult.data || [];

  // Separate co-organizers from extra attendees
  var coOrgEmails = PORTAL_CO_ORGANIZERS.map(function(p) { return p.email.toLowerCase(); });
  var savedExtras = attendees.filter(function(a) {
    return !coOrgEmails.includes(a.email.toLowerCase());
  });

  extraAttendees = savedExtras.map(function(a) {
    return { name: a.name, email: a.email };
  });

  document.getElementById('page-title').textContent = 'Edit: ' + meeting.title;
  await renderForm(meeting);
}

async function renderForm(meeting) {
  var container = document.getElementById('form-container');
  container.innerHTML =
    '<form id="meeting-form" novalidate>' +

    '<div class="form-group">' +
      '<label for="title">Title <span class="required">*</span></label>' +
      '<input type="text" id="title" name="title" required value="' + escapeAttr(meeting.title) + '">' +
    '</div>' +

    '<div class="form-group">' +
      '<label for="description">Description <span class="hint">(optional)</span></label>' +
      '<textarea id="description" name="description">' + escapeHtml(meeting.description || '') + '</textarea>' +
    '</div>' +

    '<div class="form-row">' +
      '<div>' +
        '<label for="location">Virtual link <span class="hint">(optional)</span></label>' +
        '<input type="text" id="location" name="location" value="' + escapeAttr(meeting.location || '') + '" placeholder="https://washington.zoom.us/…">' +
      '</div>' +
      '<div>' +
        '<label for="physical_location">Physical location <span class="hint">(optional)</span></label>' +
        '<input type="text" id="physical_location" name="physical_location" value="' + escapeAttr(meeting.physical_location || '') + '" placeholder="e.g. Foster 210">' +
      '</div>' +
    '</div>' +

    '<div class="form-row">' +
      '<div>' +
        '<label for="start_time">Start date & time <span class="required">*</span><span class="hint">Pacific Time</span></label>' +
        '<input type="datetime-local" id="start_time" name="start_time" required value="' + toDatetimeLocal(meeting.start_time) + '">' +
      '</div>' +
      '<div>' +
        '<label for="end_time">End date & time <span class="required">*</span><span class="hint">Pacific Time</span></label>' +
        '<input type="datetime-local" id="end_time" name="end_time" required value="' + toDatetimeLocal(meeting.end_time) + '">' +
      '</div>' +
    '</div>' +

    '<hr class="section-divider">' +

    '<div class="attendees-header"><span class="attendees-label">Attendees</span></div>' +
    '<p class="attendees-hint">Co-organizers are always included and cannot be removed.</p>' +

    '<div id="locked-attendees"></div>' +
    '<div id="extra-attendees"></div>' +

    '<div style="display:flex;gap:10px;align-items:center;margin-top:10px;margin-bottom:4px;">' +
      '<select id="cohort-select" style="flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:5px;font-size:13px;font-family:\'IBM Plex Sans\',sans-serif;color:var(--text);background:var(--white);"><option value="">Loading cohorts…</option></select>' +
      '<button type="button" id="import-cohort-btn" style="background:var(--purple-tint);border:1.5px solid var(--purple-mid);color:var(--purple);padding:9px 18px;border-radius:5px;font-size:13px;font-weight:500;font-family:\'IBM Plex Sans\',sans-serif;cursor:pointer;white-space:nowrap;">Import cohort</button>' +
    '</div>' +
    '<div id="cohort-import-msg" style="font-size:12px;color:var(--text-light);margin-bottom:8px;min-height:16px;"></div>' +

    '<button type="button" class="btn-add-attendee" id="add-attendee-btn">+ Add attendee</button>' +

    '<div id="form-error" class="form-error"></div>' +

    '<div class="form-footer">' +
      '<a href="/portal/" class="btn-cancel">Cancel</a>' +
      '<button type="submit" class="btn-submit" id="submit-btn">Save changes &amp; resend invites</button>' +
    '</div>' +

    '</form>';

  renderLockedAttendees();
  renderExtraAttendees();

  document.getElementById('add-attendee-btn').addEventListener('click', function() {
    extraAttendees.push({ name: '', email: '' });
    renderExtraAttendees();
  });

  await loadCohorts();

  document.getElementById('import-cohort-btn').addEventListener('click', function() {
    var select = document.getElementById('cohort-select');
    var cohortId = select.value;
    if (!cohortId) return;
    var cohort = allCohorts.find(function(c) { return c.id === cohortId; });
    if (!cohort || !Array.isArray(cohort.members)) return;
    var existingEmails = extraAttendees.map(function(a) { return a.email.toLowerCase(); });
    var coOrgEmails = PORTAL_CO_ORGANIZERS.map(function(p) { return p.email.toLowerCase(); });
    var added = 0;
    cohort.members.forEach(function(m) {
      if (!m.email) return;
      var emailLower = m.email.toLowerCase();
      if (existingEmails.includes(emailLower) || coOrgEmails.includes(emailLower)) return;
      extraAttendees.push({ name: m.name, email: m.email });
      existingEmails.push(emailLower);
      added++;
    });
    renderExtraAttendees();
    var msg = document.getElementById('cohort-import-msg');
    if (msg) msg.textContent = added === 0
      ? 'All members from "' + cohort.name + '" are already in the list.'
      : 'Added ' + added + ' member' + (added !== 1 ? 's' : '') + ' from "' + cohort.name + '".';
  });

  document.getElementById('meeting-form').addEventListener('submit', handleSubmit);
}

async function loadCohorts() {
  var result = await _supabase.from('cohorts').select('id, name, members').order('name');
  var select = document.getElementById('cohort-select');
  if (!select) return;
  if (result.error || !result.data || result.data.length === 0) {
    select.innerHTML = '<option value="">No cohorts — create one first</option>';
    return;
  }
  allCohorts = result.data;
  select.innerHTML = '<option value="">Select a cohort to import…</option>' +
    result.data.map(function(c) {
      var count = Array.isArray(c.members) ? c.members.length : 0;
      return '<option value="' + c.id + '">' + escapeHtml(c.name) + ' (' + count + ' members)</option>';
    }).join('');
}

function renderLockedAttendees() {
  var container = document.getElementById('locked-attendees');
  if (!container) return;
  container.innerHTML = PORTAL_CO_ORGANIZERS.map(function(p) {
    return '<div class="attendee-row locked">' +
      '<div class="attendee-locked-name">' + escapeHtml(p.name) + '</div>' +
      '<div class="attendee-locked-email">' + escapeHtml(p.email) + '</div>' +
      '<span class="attendee-badge">Co-organizer</span>' +
    '</div>';
  }).join('');
}

function renderExtraAttendees() {
  var container = document.getElementById('extra-attendees');
  if (!container) return;
  container.innerHTML = extraAttendees.map(function(a, i) {
    return '<div class="attendee-row extra">' +
      '<input type="text" placeholder="Full name" value="' + escapeAttr(a.name) + '" ' +
        'oninput="extraAttendees[' + i + '].name = this.value">' +
      '<input type="email" placeholder="Email address" value="' + escapeAttr(a.email) + '" ' +
        'oninput="extraAttendees[' + i + '].email = this.value">' +
      '<button type="button" class="btn-remove-attendee" onclick="removeAttendee(' + i + ')" title="Remove">✕</button>' +
    '</div>';
  }).join('');
}

function removeAttendee(idx) {
  extraAttendees.splice(idx, 1);
  renderExtraAttendees();
}

async function handleSubmit(e) {
  e.preventDefault();
  clearError();

  var title = document.getElementById('title').value.trim();
  var description = document.getElementById('description').value.trim();
  var location = document.getElementById('location').value.trim();
  var physicalLocation = document.getElementById('physical_location').value.trim();
  var startTime = document.getElementById('start_time').value;
  var endTime = document.getElementById('end_time').value;

  if (!title) { showError('Title is required.'); return; }
  if (!startTime) { showError('Start date and time is required.'); return; }
  if (!endTime) { showError('End date and time is required.'); return; }
  if (endTime <= startTime) { showError('End time must be after start time.'); return; }

  var validatedExtras = [];
  for (var i = 0; i < extraAttendees.length; i++) {
    var a = extraAttendees[i];
    var hasName = a.name.trim() !== '';
    var hasEmail = a.email.trim() !== '';
    if (hasName || hasEmail) {
      if (!hasName || !hasEmail) {
        showError('Each attendee must have both a name and an email address.');
        return;
      }
      validatedExtras.push(a);
    }
  }

  var submitBtn = document.getElementById('submit-btn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';

  try {
    // Update meeting
    var updateResult = await _supabase.from('meetings').update({
      title: title,
      description: description || null,
      location: location || null,
      physical_location: physicalLocation || null,
      start_time: new Date(startTime).toISOString(),
      end_time: new Date(endTime).toISOString(),
      updated_at: new Date().toISOString()
    }).eq('id', meetingId);

    if (updateResult.error) throw updateResult.error;

    // Replace all attendees (delete + re-insert)
    var deleteResult = await _supabase.from('meeting_attendees').delete().eq('meeting_id', meetingId);
    if (deleteResult.error) throw deleteResult.error;

    var attendeeRows = PORTAL_CO_ORGANIZERS.map(function(p) {
      return { meeting_id: meetingId, name: p.name, email: p.email, role: 'co_organizer' };
    });
    validatedExtras.forEach(function(a) {
      attendeeRows.push({ meeting_id: meetingId, name: a.name.trim(), email: a.email.trim(), role: 'attendee' });
    });

    var insertResult = await _supabase.from('meeting_attendees').insert(attendeeRows);
    if (insertResult.error) throw insertResult.error;

    // Resend invites (METHOD:REQUEST re-invite for calendar updates)
    await fetch(SUPABASE_URL + '/functions/v1/send-meeting-invite', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ meeting_id: meetingId })
    });

    window.location.href = '/portal/?success=updated';
  } catch (err) {
    showError('Error: ' + (err.message || 'Something went wrong. Please try again.'));
    console.error(err);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save changes & resend invites';
  }
}

// Converts a UTC ISO string from Supabase to Pacific Time for the datetime-local input
function toDatetimeLocal(iso) {
  var d = new Date(iso);
  var parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Los_Angeles',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(d);
  var get = function(type) { return parts.find(function(p) { return p.type === type; }).value; };
  var hour = get('hour') === '24' ? '00' : get('hour');
  return get('year') + '-' + get('month') + '-' + get('day') + 'T' + hour + ':' + get('minute');
}

function showError(msg) {
  var el = document.getElementById('form-error');
  el.textContent = msg;
  el.className = 'form-error visible';
}

function clearError() {
  var el = document.getElementById('form-error');
  if (el) el.className = 'form-error';
}

function escapeHtml(str) {
  var d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function escapeAttr(str) {
  return (str || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
